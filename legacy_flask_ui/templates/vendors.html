{% extends "base.html" %}
{% block content %}<div class="eyebrow">COMMUNITY SERVICES</div><h1>Vendors</h1><div class="card"><form method="post" class="form-grid"><label>Vendor Name<input name="vendor_name" required></label><label>Service Type<input name="service_type" placeholder="Plumbing, Electrical, Security..."></label><label>Contact Person<input name="contact_person"></label><label>Contact No.<input name="contact_no"></label><label>Email<input type="email" name="email"></label><label>Address<input name="address"></label><label style="grid-column:1/-1">Notes<textarea name="notes" rows="3"></textarea></label><div class="form-actions"><button class="btn primary">Save Vendor</button></div></form></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Vendor</th><th>Service</th><th>Contact</th><th>Email</th><th>Status</th></tr></thead><tbody>{% for v in rows %}<tr><td>{{v.vendor_name}}</td><td>{{v.service_type or '—'}}</td><td>{{v.contact_person or '—'}}<small class="muted" style="display:block">{{v.contact_no or ''}}</small></td><td>{{v.email or '—'}}</td><td>{{v.status}}</td></tr>{% else %}<tr><td colspan="5" class="muted">No vendors.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
