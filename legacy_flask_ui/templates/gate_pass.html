{% extends "base.html" %}
{% block content %}<div class="eyebrow">OPERATIONS</div><h1>Gate Pass</h1><div class="card form-card"><form method="post" class="form-grid"><label>Date<input type="date" name="pass_date" value="{{ today }}"></label><label>Unit No<input name="unit_no"></label><label>Visitor Name<input name="visitor_name"></label><label>Purpose<input name="purpose"></label><div class="form-actions"><button class="btn primary">Issue Gate Pass</button></div></form></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Unit</th><th>Visitor</th><th>Purpose</th><th>Status</th></tr></thead><tbody>{% for p in passes %}<tr><td>{{ p.pass_date }}</td><td>{{ p.unit_no }}</td><td>{{ p.visitor_name }}</td><td>{{ p.purpose }}</td><td><span class="badge">{{ p.status }}</span></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
<script>
(function(){
 function syncTheme(){
   var b=document.body,r=document.documentElement;
   var t=(r.getAttribute('data-theme')||b.getAttribute('data-theme')||'').toLowerCase();
   if(t==='dark') b.classList.add('cl-dark');
   else if(t==='light') b.classList.remove('cl-dark');
 }
 syncTheme();
 new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
