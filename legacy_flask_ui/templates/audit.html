{% extends "base.html" %}
{% block content %}<div class="eyebrow">ADMIN</div><h1>Audit Logs</h1><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Action</th></tr></thead><tbody>{% for x in logs %}<tr><td>{{ x.created_at }}</td><td>{{ x.username }}</td><td>{{ x.action }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
<script>
(function(){
 function syncTheme(){
   var b=document.body,r=document.documentElement;
   var t=(r.getAttribute('data-theme')||b.getAttribute('data-theme')||'').toLowerCase();
   if(t==='dark') b.classList.add('cl-dark');
   else if(t==='light') b.classList.remove('cl-dark');
 }
 syncTheme();
 new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
