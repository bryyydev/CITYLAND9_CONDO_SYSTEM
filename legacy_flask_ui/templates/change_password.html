{% extends "base.html" %}
{% block content %}
<div class="eyebrow">ACCOUNT</div><h1>Change Password</h1>
<div class="card form-card" style="max-width:620px">
<form method="post" class="form-grid">
<label>Current Password<input type="password" name="current_password" autocomplete="current-password" required></label>
<label>New Password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label>
<label>Confirm New Password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
<div class="muted">Password must be at least 8 characters.</div>
<div class="form-actions"><button class="btn primary" type="submit">Change Password</button></div>
</form></div>
{% endblock %}
<script>
(function(){
 function syncTheme(){
   var b=document.body,r=document.documentElement;
   var t=(r.getAttribute('data-theme')||b.getAttribute('data-theme')||'').toLowerCase();
   if(t==='dark') b.classList.add('cl-dark');
   else if(t==='light') b.classList.remove('cl-dark');
 }
 syncTheme();
 new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
