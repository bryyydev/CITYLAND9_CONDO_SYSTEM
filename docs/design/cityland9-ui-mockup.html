<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITYLAND 9 — UI Mockup</title>
<!--
  CityLand 9 Condo System — clickable UI mockup (design proposal, NOT the real system).
  * Fully offline: no CDN, no web fonts, no external requests.
  * Sample data is fictitious. Amounts shown are illustrative only; in the real system
    every calculation is done by the Flask backend (docs/architecture.md).
  * Open this file directly in a browser (double-click).
-->
<style>
:root{
  --bg:#f1f6f8; --surface:#ffffff; --surface-2:#f7fafb;
  --sidebar:#e8f2f6; --sidebar-2:#eef6f8; --line:#d2e1e6;
  --text:#18384d; --muted:#55748a; --faint:#8aa3b3;
  --primary:#2f7888; --primary-hover:#256170; --accent:#3f91a2; --primary-soft:#dcecf1; --active:#d3e9ef; --active-text:#1f5f6d;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fdf1d8; --bad:#b3261e; --bad-bg:#fbe4e2; --neutral:#44617a; --neutral-bg:#e8eef2;
  --shadow:0 1px 2px rgba(24,56,77,.06),0 4px 16px rgba(24,56,77,.06);
  --radius:12px; --radius-sm:8px;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  --bg:#0e1b22; --surface:#15262f; --surface-2:#112029;
  --sidebar:#112129; --sidebar-2:#15272f; --line:#24404d;
  --text:#e3eef3; --muted:#a3bccb; --faint:#6f8c9c;
  --primary:#3f91a2; --primary-hover:#4ea3b4; --accent:#6cc0d0; --primary-soft:#1b3a45; --active:#1f4452; --active-text:#a8e3ee;
  --ok:#6fd3a0; --ok-bg:#15372a; --warn:#f1c46b; --warn-bg:#3a2e12; --bad:#f19a92; --bad-bg:#40201d; --neutral:#b7cad6; --neutral-bg:#223844;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
.sidebar{background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand-text{line-height:1.15;white-space:nowrap}
.brand-text b{display:block;font-size:15px;letter-spacing:.04em}
.brand-text span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-group{margin-top:10px}
.nav-group-btn{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--muted);cursor:pointer;border-radius:6px}
.nav-group-btn:hover{color:var(--text)}
.nav-group-btn svg{width:14px;height:14px;transition:transform .15s}
.nav-group[data-open="false"] .nav-group-btn svg{transform:rotate(-90deg)}
.nav-group[data-open="false"] .nav-items{display:none}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;margin:1px 0;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;font-weight:500;white-space:nowrap}
.nav-item:hover{background:var(--sidebar-2)}
.nav-item[aria-current="page"]{background:var(--active);color:var(--active-text);font-weight:650;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item.sub{padding-left:40px;font-size:13.5px;color:var(--muted)}
.nav-item.sub[aria-current="page"]{color:var(--active-text)}
.nav-item .i{color:var(--muted)}
.nav-item[aria-current="page"] .i{color:var(--active-text)}
.sidebar-foot{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.app.collapsed .brand-text,.app.collapsed .nav-group-btn span,.app.collapsed .nav-item span,.app.collapsed .nav-item.sub,.app.collapsed .sidebar-foot span{display:none}
.app.collapsed .nav-group-btn{justify-content:center}
.app.collapsed .nav-group-btn svg{display:none}
.app.collapsed .nav-group-btn::before{content:"";display:block;width:24px;height:1px;background:var(--line)}
.app.collapsed .nav-group[data-open] .nav-items{display:block}
.app.collapsed .nav-item{justify-content:center;padding:10px}
.app.collapsed .brand{justify-content:center;padding:18px 0 14px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.icon-btn{all:unset;box-sizing:border-box;display:grid;place-items:center;width:36px;height:36px;border-radius:9px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.crumbs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.org{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;max-width:360px}
.org b{color:var(--text);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.user-chip small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.user-chip b{font-size:13px;line-height:1.1}
.content{padding:24px;max-width:1440px;width:100%}
.mobile-only{display:none}

/* ---------- Page elements ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
h1{font-size:24px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em}
.subtitle{color:var(--muted);margin:4px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;margin:0}
.card-body{padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .label{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .value{font-size:24px;font-weight:750;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent}
.kpi.hero .label,.kpi.hero .hint{color:rgba(255,255,255,.85)}
.bar{height:6px;border-radius:99px;background:var(--neutral-bg);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.two-col{grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-top:16px}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right}
table.dense th,table.dense td{padding-left:10px;padding-right:10px}
td .sub{display:block;font-size:12px;color:var(--muted)}
td .actions{flex-wrap:nowrap}
.unit-no{font-weight:700;color:var(--text);text-decoration:none}
.unit-no:hover{color:var(--primary);text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-paid{background:var(--ok-bg);color:var(--ok)} .b-partial{background:var(--warn-bg);color:var(--warn)}
.b-overdue{background:var(--bad-bg);color:var(--bad)} .b-unpaid{background:var(--neutral-bg);color:var(--neutral)}
.b-occupied{background:var(--primary-soft);color:var(--primary)} .b-vacant{background:var(--neutral-bg);color:var(--neutral)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--neutral-bg);color:var(--neutral);font-size:12px;font-weight:600}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.pager{display:flex;gap:4px}
.pager button{all:unset;cursor:pointer;min-width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.pager button[aria-current="page"]{background:var(--primary);color:#fff;border-color:var(--primary)}

/* filters, tabs, forms */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:36px}
input,select,textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
textarea{height:auto;padding:9px 11px;min-height:80px}
input:hover,select:hover{border-color:var(--faint)}
.toolbar select{width:auto;min-width:140px}
.status-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 18px 0}
.status-tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--surface)}
.status-tab .count{background:var(--neutral-bg);color:var(--neutral);border-radius:99px;padding:0 8px;font-size:12px}
.status-tab[aria-selected="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.status-tab[aria-selected="true"] .count{background:var(--primary);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{all:unset;cursor:pointer;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.field .err{font-size:12px;color:var(--bad);margin-top:4px;display:none}
.field.invalid input,.field.invalid select{border-color:var(--bad)}
.field.invalid .err{display:block}
.check{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm)}
.check input{width:16px;height:16px;margin-top:2px}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--text);font-size:13px}
.note.warn{background:var(--warn-bg)}
.note svg{color:var(--primary);margin-top:1px}

/* modal + drawer */
.overlay{position:fixed;inset:0;background:rgba(10,25,35,.45);display:none;z-index:40}
.overlay.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;z-index:41;display:none}
.modal.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:41;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .card-body{overflow:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.split div{padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line)}
.split small{display:block;color:var(--muted);font-size:12px}
.split b{font-size:16px}

/* states */
.skeleton{border-radius:6px;background:linear-gradient(90deg,var(--neutral-bg) 25%,var(--surface-2) 50%,var(--neutral-bg) 75%);background-size:200% 100%;animation:sh 1.2s infinite;height:14px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .big{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 12px}
.empty h3{color:var(--text);margin:0 0 4px;font-size:16px}
.error-box{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1px solid var(--bad);background:var(--bad-bg);border-radius:var(--radius);color:var(--text)}
.error-box svg{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;display:none;box-shadow:var(--shadow)}

/* chart */
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding:8px 4px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .b{width:40%;max-width:22px;border-radius:5px 5px 0 0;background:var(--accent)}
.chart .b.c{background:var(--primary-soft);border:1px solid var(--accent)}
.chart small{color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.c{background:var(--primary-soft);border:1px solid var(--accent)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}

/* SOA document */
.soa{max-width:860px;margin:0 auto;padding:36px 40px;background:#fff;color:#18384d;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.soa-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #2f7888;padding-bottom:14px}
.soa-head h2{margin:0;font-size:18px;letter-spacing:.02em}
.soa-head p{margin:2px 0;color:#55748a;font-size:12.5px}
.soa-title{text-align:right}
.soa-title b{font-size:20px;letter-spacing:.06em;color:#2f7888}
.soa-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.soa-meta div{background:#f1f6f8;border-radius:8px;padding:9px 11px}
.soa-meta small{display:block;font-size:11px;color:#55748a;font-weight:700;letter-spacing:.06em}
.soa-meta b{font-size:14px}
.soa h3{font-size:12px;letter-spacing:.1em;color:#2f7888;margin:22px 0 6px}
.soa table th{position:static;background:#f1f6f8;color:#55748a}
.soa table td{border-color:#d2e1e6}
.soa .total-row td{font-size:16px;font-weight:800;border-top:2px solid #18384d;background:#dcecf1}
.soa-pay{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;border:1px dashed #9fc3cd;border-radius:10px;padding:14px}
.qr{width:120px;height:120px}

/* demo panel */
.demo{position:fixed;right:16px;bottom:16px;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px);font-size:12.5px}
.demo b{color:var(--accent);letter-spacing:.08em;font-size:11px}
.demo select{height:30px;width:auto;padding:0 8px;font-size:12.5px}
.demo .btn{height:30px;font-size:12.5px}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:linear-gradient(160deg,#2f7888,#3f91a2 55%,#8cc7d3);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-art h2{font-size:34px;line-height:1.15;margin:0;max-width:440px}
.login-art p{opacity:.9;max-width:420px}
.building{opacity:.9}
.login-form{display:grid;place-items:center;padding:32px;background:var(--surface)}
.login-card{width:min(380px,100%)}
.login-card h1{margin-bottom:4px}

@media (max-width:1500px){.two-col{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .app.drawer-open .sidebar{transform:none}
  .app.collapsed .brand-text,.app.collapsed .nav-group-btn span,.app.collapsed .nav-item span,.app.collapsed .nav-item.sub,.app.collapsed .sidebar-foot span{display:revert}
  .desktop-only{display:none}.mobile-only{display:grid}
  .org{display:none}
  .content{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:1fr}
  .soa{padding:20px 16px}.soa-meta{grid-template-columns:1fr 1fr}
  .login{grid-template-columns:1fr}.login-art{display:none}
  .topbar{padding:10px 16px}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.user-chip>div:not(.avatar){display:none}.user-chip{padding:3px}}
@media print{
  .sidebar,.topbar,.demo,.no-print,.page-head .actions{display:none!important}
  .app{display:block}.content{padding:0}.soa{border:0;box-shadow:none;padding:0}
  body{background:#fff}
}
</style>
</head>
<body>

<!-- Icon sprite (inline, offline) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>

  {no:"TEST-503",floor:"5",type:"2 BEDROOM",status:"Occupied",owner:"Liza Garcia",tenant:"",parking:"",storage:"",soa:"Overdue",bal:8360},

  {no:"601",floor:"6",type:"1 BEDROOM",status:"Occupied",owner:"Grace Tan",tenant:"",parking:"",storage:"",soa:"Partially Paid",bal:1875},
  {no:"602",floor:"6",type:"STUDIO TYPE",status:"Vacant",owner:"Paolo Aquino",tenant:"",parking:"",storage:"",soa:"Paid",bal:0},

  {no:"TEST-501",who:"Maria Santos",sub:"Owner",period:"September 2026",total:2990,unpaid:0,adv:10,status:"Paid"},

  {no:"TEST-503",who:"Liza Garcia",sub:"Owner",period:"September 2026",total:8360,unpaid:8360,adv:0,status:"Overdue"},

/* ---------- state ---------- */
const S = {role:"super_admin", page:"login", theme:"light", demo:"normal", collapsed:false, billTab:"All", unitTab:"Units", setTab:"General", q:"", openGroups:{}};
try{ const saved = JSON.parse(localStorage.getItem("cl9-mockup")||"{}"); Object.assign(S, {theme:saved.theme||"light", collapsed:!!saved.collapsed}); }catch(e){}
const save = () => { try{ localStorage.setItem("cl9-mockup", JSON.stringify({theme:S.theme,collapsed:S.collapsed})); }catch(e){} };
const can = roles => roles.includes(S.role);
function findItem(id){ for(const g of NAV) for(const it of g.items){ if(it.id===id) return {g,it}; for(const c of it.children||[]) if(c.id===id) return {g,it,c}; } return null; }

/* ---------- shell ---------- */
function sidebar(){
  return NAV.map((g,gi)=>{
    const items = g.items.filter(it => can(it.roles) || (it.children||[]).some(c=>can(c.roles)));
    if(!items.length) return "";
    const open = S.openGroups[gi] !== false;
    return `<div class="nav-group" data-open="${open}">
      <button class="nav-group-btn" aria-expanded="${open}" data-group="${gi}"><span>${g.group}</span>${icon("chev")}</button>
      <div class="nav-items">${items.map(it=>{
        const kids = (it.children||[]).filter(c=>can(c.roles));
        if(!it.children) return navLink(it.id,it.label,it.icon);
        // A parent is either a page of its own (Employees) or just a heading for its sub-pages (Units, Billing & SOA).
        const parentIsPage = it.page && can(it.roles);
        const target = parentIsPage ? it.id : kids[0].id;
        return navLink(target,it.label,it.icon, parentIsPage ? undefined : false) +
               kids.map(k=>`<a class="nav-item sub" href="#${k.id}" ${S.page===k.id?'aria-current="page"':""}><span>${k.label}</span></a>`).join("");
      }).join("")}</div></div>`;
  }).join("");
}
function navLink(id,label,ic,forceOff){
  const cur = forceOff===false ? false : S.page===id;
  return `<a class="nav-item" href="#${id}" title="${label}" ${cur?'aria-current="page"':""}>${icon(ic)}<span>${label}</span></a>`;
}
function shell(inner){
  const f = findItem(S.page);
  const crumbs = f ? `${f.g.group.charAt(0)+f.g.group.slice(1).toLowerCase()} / ${f.c && f.c.label!==f.it.label ? f.it.label+" / " : ""}<b>${(f.c||f.it).label}</b>` : "<b>Statement of Account</b>";
  return `<div class="app ${S.collapsed?"collapsed":""}" id="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark">C9</div><div class="brand-text"><b>CITYLAND 9</b><span>CONDO SYSTEM 2026</span></div></div>
      <nav class="nav">${sidebar()}</nav>
      <div class="sidebar-foot"><i class="dot"></i><span>LAN SYSTEM · Online</span></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" data-act="drawer" aria-label="Open menu">${icon("menu")}</button>
        <button class="icon-btn desktop-only" data-act="collapse" aria-label="Collapse sidebar">${icon("panel")}</button>
        <div class="crumbs">${crumbs}</div>
        <div class="spacer"></div>
        <div class="org"><b>CITYLAND 9 CONDOMINIUM CORPORATION</b>9 Dela Rosa St., Brgy. Pio del Pilar, Makati City</div>
        <button class="icon-btn" data-act="theme" aria-label="Toggle light/dark theme">${icon("sun")}</button>
        <div class="user-chip"><div class="avatar">${ROLE_LABEL[S.role].slice(0,2).toUpperCase()}</div><div><b>${S.role==="super_admin"?"superadmin":"demo."+S.role}</b><small>${ROLE_LABEL[S.role]}</small></div></div>
        <button class="icon-btn" data-act="logout" aria-label="Sign out">${icon("logout")}</button>
      </header>
      <main class="content" id="content">${inner}</main>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>`;
}

/* ---------- state helpers (loading / empty / error) ---------- */
function stateBlock(kind, what){
  if(kind==="loading") return `<div class="card-body" aria-busy="true">${Array.from({length:6},(_,i)=>`<div class="skeleton" style="width:${[92,78,85,60,88,70][i]}%;margin:14px 0"></div>`).join("")}<span class="sr-only">Loading ${what}…</span></div>`;
  if(kind==="empty") return `<div class="empty"><div class="big">${icon("search")}</div><h3>No ${what} found</h3><p>No records match the current search and filters.</p><button class="btn sm" data-act="clear">Clear filters</button></div>`;
  if(kind==="error") return `<div class="card-body"><div class="error-box" role="alert">${icon("alert")}<div><b>Couldn't load ${what}.</b><div class="subtitle">The server did not respond. Your data is safe. Check that the CityLand 9 server PC is on, then try again.</div><button class="btn sm" style="margin-top:10px" data-act="retry">Try again</button></div></div></div>`;
  return null;
}

function qr(){ // decorative pseudo-QR pattern (sample only)
  let s="", seed=7; const rnd=()=> (seed=(seed*9301+49297)%233280)/233280;
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#18384d"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#18384d"/>`;
  for(let y=0;y<29;y++)for(let x=0;x<29;x++){ const inF=(x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20); if(!inF&&rnd()>.52) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#18384d"/>`; }
  return s+finder(0,0)+finder(22,0)+finder(0,22);
}

function updateSplit(){
  const form=document.querySelector('[data-form="pay"]'); if(!form) return;
  const bal=+form.dataset.bal, amt=+document.getElementById("amt").value||0;
  const toBill=Math.min(amt,bal), extra=Math.max(amt-bal,0);
  document.getElementById("split").innerHTML=`<div><small>Applied to this SOA</small><b>${peso(toBill)}</b></div><div><small>Saved as Advance Payment</small><b>${peso(extra)}</b></div>`;

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-group],[data-billtab],[data-unittab],[data-settab],#overlay"); if(!el) return;
  if(el.id==="overlay"){ closeModal(); return; }
  if(el.dataset.group!==undefined){ const gi=el.dataset.group; S.openGroups[gi] = S.openGroups[gi]===false; render(); return; }
  if(el.dataset.billtab){ S.billTab=el.dataset.billtab; render(); return; }

  if(el.dataset.settab){ S.setTab=el.dataset.settab; render(); return; }
  const a=el.dataset.act;
  if(a==="collapse"){ S.collapsed=!S.collapsed; save(); render(); }
  else if(a==="drawer"){ document.getElementById("app").classList.add("drawer-open"); document.getElementById("overlay").classList.add("open"); }
  else if(a==="theme"){ S.theme=S.theme==="dark"?"light":"dark"; save(); render(); }
  else if(a==="logout"){ S.page="login"; location.hash=""; render(); }
  else if(a==="pay"){ e.preventDefault(); openModal(paymentModal(el.dataset.unit, +el.dataset.bal)); }
  else if(a==="add-unit"){ e.preventDefault(); openModal(unitDrawer()); }
  else if(a==="close"){ closeModal(); }
  else if(a==="save-pay"){
    const meth=document.getElementById("meth").value, ref=document.getElementById("ref").value.trim(), amt=+document.getElementById("amt").value;
    document.getElementById("f-amt").classList.toggle("invalid", !(amt>0));
    document.getElementById("f-ref").classList.toggle("invalid", meth!=="CASH" && !ref);
    if(amt>0 && (meth==="CASH"||ref)){ closeModal(); toast("Payment recorded (mockup: nothing was saved)"); }
  }
  else if(a==="save-unit"){ closeModal(); toast("Unit saved (mockup: nothing was saved)"); }
  else if(a==="save-settings"){ if(confirm("Save changes to Rates & Rules?")) toast("Settings saved and recorded in Audit Logs (mockup)"); }
  else if(a==="generate"){ if(confirm("Generate September 2026 bills for all active units without a bill?")) toast("Generated 0 new bills (mockup)"); }
  else if(a==="print"){ window.print(); }
  else if(a==="clear"||a==="retry"){ S.q=""; S.demo="normal"; render(); }
});
document.addEventListener("input",e=>{
  if(e.target.dataset.input==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const i=document.querySelector('[data-input="q"]'); if(i){ i.focus(); i.setSelectionRange(pos,pos);} }
  if(e.target.id==="amt") updateSplit();
});
document.addEventListener("change",e=>{
  if(e.target.dataset.demo==="role"){ S.role=e.target.value; S.page=ROLE_HOME[S.role]; location.hash=S.page; render(); toast("Signed in as "+ROLE_LABEL[S.role]+": menu shows only permitted modules"); }
  if(e.target.dataset.demo==="state"){ S.demo=e.target.value; render(); }
});
document.addEventListener("submit",e=>{
  if(e.target.dataset.form==="login"){ e.preventDefault();
    const u=document.getElementById("u").value.trim(), p=document.getElementById("p").value;
    document.getElementById("f-user").classList.toggle("invalid",!u); document.getElementById("f-pass").classList.toggle("invalid",!p);
    if(u&&p){ S.role=document.getElementById("r").value; S.page=ROLE_HOME[S.role]; location.hash=S.page; render(); }
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

// Optional URL parameters for demos: ?role=staff&theme=dark#billing
const params = new URLSearchParams(location.search);
if(ROLE_LABEL[params.get("role")]) S.role = params.get("role");
if(["light","dark"].includes(params.get("theme"))) S.theme = params.get("theme");
const start = location.hash.slice(1); if(start){ S.page=start; }
render();
</script>
</body>
</html>
